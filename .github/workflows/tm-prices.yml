name: Ticketmaster prices
# Runs right after the daily refresh lands (and once a morning as a backup).
# Needs the repo secret TM_API_KEY (free key from developer.ticketmaster.com). Without it, it does nothing.
on:
  push:
    branches: [main]
    paths: [events.json]
  schedule:
    - cron: "17 15 * * *"   # ~7-8 AM Pacific
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: events-json, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
      TM_API_KEY: ${{ secrets.TM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "show-shack-bot"
          git config user.email "show-shack-bot@users.noreply.github.com"
          # events.json is one long line, so git can't merge two edits to it. Instead: start from the
          # latest main, redo the price pass, push; if someone pushed meanwhile, start over.
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/tm_prices.py events.json
            git diff --quiet events.json && { echo "No price changes."; exit 0; }
            git add events.json
            git commit -q -m "Ticketmaster prices: $(python3 -c "import json;print(json.load(open('events.json')).get('tmNote',''))")"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
