name: Ticketmaster prices
# Runs right after the daily refresh lands (and once a morning as a backup).
# Needs the repo secret TM_API_KEY (free key from developer.ticketmaster.com). Without it, it does nothing.
on:
  push:
    branches: [main]
    paths: [events.json]
  schedule:
    - cron: "17 15 * * *"   # ~7-8 AM Pacific
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: events-json, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
      TM_API_KEY: ${{ secrets.TM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tm_prices.py events.json
      - run: |
          git diff --quiet events.json && { echo "No price changes."; exit 0; }
          git config user.name "show-shack-bot"
          git config user.email "show-shack-bot@users.noreply.github.com"
          git add events.json
          git commit -m "Ticketmaster prices: $(python3 -c "import json;print(json.load(open('events.json')).get('tmNote',''))")"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
