name: Artist logos
# Looks up transparent artist logos (TheAudioDB) for headliners in events.json and stores them in logos.json.
on:
  workflow_dispatch:
  schedule: [{ cron: "40 15 * * *" }]   # ~7:40 AM PT, after the daily refresh
permissions:
  contents: write
concurrency: { group: logos, cancel-in-progress: false }
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/logos.py 600
      - run: |
          git config user.name "show-shack-bot"
          git config user.email "show-shack-bot@users.noreply.github.com"
          cp logos.json /tmp/logos.json
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/logos.json logos.json
            git diff --quiet logos.json 2>/dev/null && git ls-files --error-unmatch logos.json >/dev/null 2>&1 && { echo "No change."; exit 0; }
            git add logos.json && git commit -q -m "Artist logos (TheAudioDB)" && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
