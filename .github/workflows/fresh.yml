name: Recently added
# Dates each show the day it first shows up in events.json (fresh.json). Powers "Recently added" on the home screen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [events.json]
  schedule: [{ cron: "55 15 * * *" }]   # ~7:55 AM PT, after the daily refresh (backup if the push trigger didn't fire)
permissions:
  contents: write
concurrency: { group: fresh, cancel-in-progress: false }
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "show-shack-bot"
          git config user.email "show-shack-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/firstseen.py
            git diff --quiet fresh.json 2>/dev/null && git ls-files --error-unmatch fresh.json >/dev/null 2>&1 && { echo "No change."; exit 0; }
            git add fresh.json && git commit -q -m "Recently added: date new shows" && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
